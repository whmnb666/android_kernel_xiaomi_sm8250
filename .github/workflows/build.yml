name: Build Droidspaces Apollo

on:
  push:
    branches:
      - droidspaces-apollo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kernel:
    name: Apollo | MIUI | ReSukiSU | Droidspaces
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio curl flex \
            gawk git libelf-dev libssl-dev libncurses-dev lz4 lzop \
            python-is-python3 rsync unzip zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          CCACHE_DIR="$HOME/.cache/ccache_mikernel" ccache -M 2G

      - name: Cache compiler results
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ccache_mikernel
          key: droidspaces-apollo-miui-ksu-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            droidspaces-apollo-miui-ksu-${{ runner.os }}-

      - name: Install verified Clang 16 toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/zyc-clang"
          gh release download 16.0.6-20260807-release --repo ZyCromerZ/Clang \
            --pattern Clang-16.0.6-20260807.tar.gz --dir "$RUNNER_TEMP"
          printf '%s  %s\n' \
            c11341a58e15cebc4e25472291791ae6a5dceb3675c9dfde2cb035ad893b6ae0 \
            "$RUNNER_TEMP/Clang-16.0.6-20260807.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/Clang-16.0.6-20260807.tar.gz" -C "$HOME/zyc-clang"

      - name: Build Apollo MIUI with ReSukiSU
        run: |
          set -o pipefail
          bash build_kernel.sh apollo ksu miui 2>&1 | tee build.log

      - name: Verify embedded configuration and packaged images
        run: |
          bash scripts/extract-ikconfig out_miui/arch/arm64/boot/Image > kernel-miui.config
          cmp out_miui/.config kernel-miui.config
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archives = list(Path('.').glob('APTKernel_*.zip'))
          if len(archives) != 1:
              raise SystemExit(f'Expected one kernel ZIP, got {len(archives)}')
          with ZipFile(archives[0]) as archive:
              for name in ('Image', 'dtb', 'dtbo.img'):
                  if archive.getinfo(f'kernels/miui/{name}').file_size == 0:
                      raise SystemExit(f'Empty kernel artifact: {name}')
          PY
          sha256sum APTKernel_*.zip > SHA256SUMS

      - name: Upload verified kernel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Droidspaces-apollo-MIUI-ReSukiSU-${{ github.run_id }}
          path: |
            APTKernel_*.zip
            kernel-miui.config
            SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Droidspaces-apollo-build-log-${{ github.run_id }}
          path: |
            build.log
            out_miui/.config
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
